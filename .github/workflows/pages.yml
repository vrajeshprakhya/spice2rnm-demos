name: waveform pages

# Publishes the zoomable waveform pages (showcase/<case>/waveforms/*.html)
# to GitHub Pages, with an index. Only those pages are served; the site is
# built by showcase/build_pages.sh, which can be run locally to preview it.

on:
  push:
    branches: [main]
    paths:
      - "showcase/*/waveforms/**"
      - "showcase/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the waveform pages
        run: bash showcase/build_pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
